<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#941d14">
<title>产品资料中心｜镌极科技</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
:root{--red:#941d14;--ink:#221717;--muted:#807171;--paper:#fff;--deep-red:#2c1717;--line:#e8e2e2}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
html{background:var(--red)}
body{color:var(--ink);font-family:Arial,"Microsoft YaHei","PingFang SC",sans-serif;background:var(--red)}
.page{width:min(100%,760px);margin:0 auto;padding:64px 38px 52px}
.panel{position:relative;background:var(--paper);border-radius:34px;padding:96px 20px 15px;box-shadow:0 2px 5px rgba(0,0,0,.04)}
.logo-wrap{position:absolute;left:50%;top:-72px;transform:translateX(-50%);width:168px;height:168px;border-radius:50%;display:grid;place-items:center;background:#fff;border:5px solid #f2f2f2;box-shadow:0 2px 3px rgba(0,0,0,.08);overflow:hidden;text-decoration:none;cursor:pointer;transition:box-shadow .18s ease,transform .18s ease}
.logo-wrap:hover{transform:translateX(-50%) scale(1.03);box-shadow:0 6px 16px rgba(0,0,0,.16)}
.logo-wrap:focus-visible{outline:3px solid #fff;outline-offset:4px}
.logo-wrap img{width:88%;height:88%;object-fit:contain;border-radius:50%}
.brand{text-align:center;color:var(--red);font-size:19px;font-weight:700;letter-spacing:1px;margin:0 0 6px}
h1{color:#000;text-align:center;font-size:32px;line-height:1.25;margin:0 0 8px;font-weight:750;letter-spacing:.5px}
.intro{width:fit-content;max-width:100%;margin:0 auto 10px;text-align:left;color:#777780;font-size:18px;line-height:1.6}
.documents{display:grid;gap:12px}
.document-card{display:flex;align-items:stretch;gap:18px;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:#fff;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;transition:border-color .18s ease,transform .18s ease,box-shadow .18s ease}
.document-card:hover{border-color:#d8cbcb;transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.06)}
.document-card:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.pdf-icon{flex:0 0 78px;width:78px;align-self:flex-start;min-height:110px;border-radius:10px;background:#fbefee;color:#d94a45;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800}
.cover{position:relative;flex:0 0 96px;width:96px;align-self:flex-start;aspect-ratio:1/1.4142;overflow:hidden;border-radius:8px;background:#f6f2f2;border:1px solid #e7dfdf;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover-tag{position:absolute;left:0;bottom:0;padding:2px 7px;border-top-right-radius:7px;background:rgba(217,74,69,.94);color:#fff;font-size:10px;font-weight:800;line-height:1.5}
.document-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.info-top{min-width:0}
.document-title{margin:0 0 5px;color:#000;font-size:19px;line-height:1.35;font-weight:750;overflow-wrap:anywhere}
.document-subtitle{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
.document-date{margin:0;color:#a29494;font-size:12px;line-height:1.4;letter-spacing:.3px}
.website{margin:54px 0 0;text-align:center;color:#fff;font-size:23px;font-weight:600;letter-spacing:.2px}
.website a{color:inherit;text-decoration:none}
.website a:hover{text-decoration:underline}
.doc-count{margin:0 0 13px;text-align:center;color:#a29494;font-size:15px;letter-spacing:.3px}
.empty{margin:0;padding:42px 24px;border:1px dashed var(--line);border-radius:16px;text-align:center;color:var(--muted);font-size:16px;line-height:1.8}
.disclaimer{width:100%;margin:22px 0 0;padding-top:16px;border-top:1px solid var(--line);text-align:center;color:#a29494;font-size:12px;line-height:1.6;letter-spacing:.3px}
.toast{position:fixed;left:50%;bottom:34px;z-index:50;max-width:calc(100% - 40px);padding:12px 20px;border-radius:12px;background:rgba(34,23,23,.94);color:#fff;font-size:15px;line-height:1.6;text-align:center;box-shadow:0 10px 26px rgba(0,0,0,.18);opacity:0;transform:translate(-50%,10px);pointer-events:none;transition:opacity .2s ease,transform .2s ease}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:600px){
 .page{padding:52px 12px 44px}
 .panel{border-radius:28px;padding:84px 12px 12px}
 .logo-wrap{width:140px;height:140px;top:-56px;border-width:4px}
 .brand{font-size:16px;margin-bottom:5px}
 h1{font-size:27px;line-height:1.25;margin-bottom:7px}
 .intro{font-size:16px;line-height:1.55;margin-bottom:8px}
 .documents{gap:10px}
 .doc-count{margin:0 0 10px;font-size:13px}
 .empty{padding:32px 16px;font-size:14px}
 .disclaimer{margin-top:18px;padding-top:13px;font-size:11px}
 .document-card{padding:12px;gap:12px;border-radius:14px}
 .pdf-icon{flex-basis:52px;width:52px;min-height:74px;border-radius:10px;font-size:13px}
 .cover{flex-basis:76px;width:76px;border-radius:7px}
 .cover-tag{font-size:9px;padding:1px 5px}
 .document-info{gap:4px}
 .document-title{font-size:17px;line-height:1.35;margin-bottom:4px}
 .document-subtitle{font-size:13px;line-height:1.4}
 .document-date{font-size:11px}
 .website{font-size:18px;margin-top:42px}
}
@media(max-width:360px){
 .page{padding-left:10px;padding-right:10px}
 .panel{padding-left:10px;padding-right:10px}
 .document-card{gap:10px;padding:11px 10px}
 .pdf-icon{flex-basis:46px;width:46px;min-height:66px}
 .cover{flex-basis:64px;width:64px}
 .document-title{font-size:15px}
 .document-subtitle{font-size:12px}
 .document-date{font-size:10px}
}
</style>
</head>

<script>
(function () {
  var isWeChat = /MicroMessenger/i.test(navigator.userAgent || '');
  var toastEl = null;
  var toastTimer = null;

  function toast(message, holdMs) {
    if (!toastEl) {
      toastEl = document.createElement('div');
      toastEl.className = 'toast';
      toastEl.setAttribute('role', 'status');
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = message;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove('show');
    }, holdMs || 2600);
  }

  // 整张卡片即下载入口：沿父级向上找带 data-pdf 的卡片节点。
  function findCard(node) {
    while (node && node !== document) {
      if (node.getAttribute && node.getAttribute('data-pdf')) return node;
      node = node.parentNode;
    }
    return null;
  }

  // 非微信浏览器：临时 <a download> 走原生下载，可复用 HTTP 缓存、支持断点续传。
  function nativeDownload(url, name) {
    var a = document.createElement('a');
    a.href = url;
    if (name) a.download = name;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  // 微信内置浏览器对跨域 OSS 直连会弹“安全跳转”拦截页，这里改用 XHR
  // （CORS 已配置）把文件取成 Blob，再用同域 blob: 链接保存，不触发拦截。
  function saveBlob(url, name) {
    return new Promise(function (resolve, reject) {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', url, true);
      xhr.responseType = 'blob';
      xhr.onload = function () {
        if (xhr.status >= 200 && xhr.status < 300) {
          var blobUrl = URL.createObjectURL(xhr.response);
          var a = document.createElement('a');
          a.href = blobUrl;
          if (name) a.download = name;
          a.rel = 'noopener';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function () { URL.revokeObjectURL(blobUrl); }, 2000);
          resolve();
        } else {
          reject(new Error('HTTP ' + xhr.status));
        }
      };
      xhr.onerror = function () { reject(new Error('network error')); };
      xhr.send();
    });
  }

  function doDownload(card) {
    var url = card.getAttribute('data-pdf');
    var name = card.getAttribute('data-name') || '';

    // file:// 打开时浏览器禁止下载本地文件，如实提示
    if (location.protocol === 'file:') {
      toast('以本地文件方式打开时，浏览器不允许直接下载；请部署后再下载。', 4600);
      window.open(url, '_blank');
      return;
    }

    if (isWeChat) {
      toast('正在下载…');
      saveBlob(url, name).then(function () {
        toast('已开始下载，可在通知或文件中查看');
      }).catch(function () {
        toast('下载失败，请稍后重试');
      });
    } else {
      nativeDownload(url, name);
      toast('已开始下载，可在浏览器下载记录中查看');
    }
  }

  // 点击卡片任意位置即下载
  document.addEventListener('click', function (event) {
    var card = findCard(event.target);
    if (!card) return;
    event.preventDefault();
    doDownload(card);
  });

  // 键盘可达：卡片 role=button，Enter / 空格触发下载
  document.addEventListener('keydown', function (event) {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    var card = findCard(event.target);
    if (!card) return;
    event.preventDefault();
    doDownload(card);
  });
})();
</script>
