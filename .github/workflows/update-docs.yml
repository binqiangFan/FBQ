name: 自动更新文档列表

# 往 pdf/ 上传或删除 PDF 后，自动重建 index.html 里的文档卡片并提交回去。
# 也可以在 Actions 页面点 "Run workflow" 手动跑一次（页面显示不准时用这个）。

on:
  push:
    branches:
      - main
      - master
    paths:
      - "pdf/**"
      - "资料说明.json"
      - "一键更新/资料说明.json"
      - "tools/build_docs.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # 同一时间只跑一个重建任务；排队执行，不取消正在跑的那个
  group: docs-index-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出仓库
        # 需要完整历史：PDF 的显示日期取的是它最后一次提交的日期
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装封面渲染依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pymupdf>=1.24,<2" "pillow>=10,<14"

      - name: 重建列表并提交
        # 关键点：每次都先对齐远端最新代码再重新生成。
        # 连续快速上传/删除时，前一次运行生成的 index.html 会作废，重来一次即可，
        # 不会出现推送被拒或两次运行互相冲突。
        run: |
          set -e
          BRANCH="${GITHUB_REF_NAME:-main}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            if git fetch -q origin "$BRANCH"; then
              git reset -q --hard "origin/$BRANCH"
            else
              echo "拉取远端失败，用当前工作区继续"
            fi

            python tools/build_docs.py

            if git diff --quiet -- index.html; then
              echo "列表与仓库一致，无需提交"
              exit 0
            fi

            git add index.html
            git commit -q -m "docs: 自动重建文档列表"

            if git push origin "HEAD:$BRANCH"; then
              echo "已重建并推送（第 $attempt 次尝试）"
              exit 0
            fi

            echo "推送被拒绝，重新对齐远端后重试（第 $attempt 次）"
            sleep 5
          done

          echo "重试 3 次仍未推送成功，请到 Actions 页面点 Run workflow 手动跑一次"
          exit 1
