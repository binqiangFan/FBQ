name: 自动更新文档列表

# 往 pdf/ 上传 PDF（网页上传、git push 都算）后，自动重建 index.html 里的文档卡片并提交回去。
# 也可以在 Actions 页面点 "Run workflow" 手动跑一次。

on:
  push:
    branches:
      - main
      - master
    paths:
      - "pdf/**"
      - "资料说明.json"
      - "一键更新/资料说明.json"
      - "tools/build_docs.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-index-rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出仓库
        # 需要完整历史：PDF 的显示日期取的是它最后一次提交的日期
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装封面渲染依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pymupdf>=1.24,<2" "pillow>=10,<14"

      - name: 重建文档列表
        run: python tools/build_docs.py

      - name: 提交变更
        # 有变化才提交，没变化直接跳过（避免无意义的提交和多余的 Pages 构建）
        run: |
          set -e
          if git diff --quiet -- index.html; then
            echo "index.html 没有变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "docs: 自动重建文档列表"
          git push || { git pull --rebase --autostash && git push; }
