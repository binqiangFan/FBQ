name: 自动更新文档列表

on:
  push:
    branches:
      - main
      - master
    paths:
      - "pdf/**"
      - "资料说明.json"
      - "一键更新/资料说明.json"
      - "tools/build_docs.py"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: docs-index-rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装封面渲染依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pymupdf>=1.24,<2" "pillow>=10,<14"

      - name: 重建文档列表
        run: python tools/build_docs.py

      - name: 提交变更
        id: commit
        run: |
          set -e
          if git diff --quiet -- index.html; then
            echo "index.html 没有变化，跳过提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "docs: 自动重建文档列表"
          git push || { git pull --rebase --autostash && git push; }
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 触发 Pages 重新部署
        # 机器人用 GITHUB_TOKEN 提交时，GitHub 不会自动再触发 Pages 构建，
        # 这里主动请求一次，保证新卡片能上线；请求失败也不影响文档列表更新。
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent \
            && echo "已请求 Pages 重新构建" \
            || echo "Pages 构建请求未成功（推送可能已自动触发部署），不影响文档列表"
