name: 自动更新文档列表

# 上传/删除 pdf/ 里的文件后：重建 index.html 的文档卡片 → 提交回仓库 → 直接发布到 GitHub Pages。
# 这个流程不依赖「分支部署」，所以不会再出现被取消的 pages build 运行。

on:
  push:
    branches:
      - main
      - master
    paths:
      - "pdf/**"
      - "资料说明.json"
      - "一键更新/资料说明.json"
      - "tools/build_docs.py"
      - "index.html"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # 同一时间只跑一个任务；排队执行，不取消正在跑的那个
  group: docs-pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出仓库
        # 需要完整历史：PDF 的显示日期取的是它最后一次提交的日期
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装封面渲染依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pymupdf>=1.24,<2" "pillow>=10,<14"

      - name: 重建列表并提交
        # 每次都先对齐远端最新代码再重新生成；推送被拒就重来，连续操作也不会失败
        run: |
          set -e
          BRANCH="${GITHUB_REF_NAME:-main}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            if git fetch -q origin "$BRANCH"; then
              git reset -q --hard "origin/$BRANCH"
            else
              echo "拉取远端失败，用当前工作区继续"
            fi

            python tools/build_docs.py

            if git diff --quiet -- index.html; then
              echo "列表与仓库一致，无需提交"
              exit 0
            fi

            git add index.html
            git commit -q -m "docs: 自动重建文档列表"

            if git push origin "HEAD:$BRANCH"; then
              echo "已重建并推送（第 $attempt 次尝试）"
              exit 0
            fi

            echo "推送被拒绝，重新对齐远端后重试（第 $attempt 次）"
            sleep 5
          done

          echo "重试 3 次仍未推送成功"
          exit 1

      - name: 打包发布目录
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
